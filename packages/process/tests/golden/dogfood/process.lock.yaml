  processes:
    process_supplier_invoice:
      id: process_supplier_invoice
      dir: null
      definition:
        kind: process
        name: process_supplier_invoice
        goal: Turn a supplier invoice PDF into a validated record in the records store.
        provider: claude-code
        env:
          base: debian-slim-python
          vars:
            RECORDS_DIR: Directory where validated invoice records are written as JSON.
            REVIEW_DIR: Directory where validated records with a total over 10,000 are written for approval instead.
            ESCALATIONS_DIR: Directory where escalation tickets for a human reviewer are written.
        entry: read
        inputs:
          pdf_path: path
        outputs:
          done:
            record: object
          not_an_invoice: {}
          needs_review: {}
        exits:
        - done
        - not_an_invoice
        - needs_review
        examples:
        - inputs:
            pdf_path: examples/acme_inv_1042.pdf
          outputs:
            record:
              key: acme-supplies-ltd__INV-1042
              supplier: ACME Supplies Ltd
              invoice_number: INV-1042
              total: 1200.5
              currency: GBP
              due_date: 2026-10-01
          exit: done
          env:
            RECORDS_DIR: '{tmp}/records'
            REVIEW_DIR: '{tmp}/review'
            ESCALATIONS_DIR: '{tmp}/escalations'
        - inputs:
            pdf_path: examples/globex_inv_77810.pdf
          outputs:
            record:
              key: globex-corporation__GX-77810
              supplier: Globex Corporation
              invoice_number: GX-77810
              total: 14250.0
              currency: USD
              due_date: 2026-11-15
          exit: done
          env:
            RECORDS_DIR: '{tmp}/records'
            REVIEW_DIR: '{tmp}/review'
            ESCALATIONS_DIR: '{tmp}/escalations'
        - inputs:
            pdf_path: examples/initech_inv_5521.pdf
          outputs:
            record:
              key: initech-canada-inc__IC-5521
              supplier: Initech Canada Inc.
              invoice_number: IC-5521
              total: 980.0
              currency: CAD
              due_date: 2026-10-20
          exit: done
          env:
            RECORDS_DIR: '{tmp}/records'
            REVIEW_DIR: '{tmp}/review'
            ESCALATIONS_DIR: '{tmp}/escalations'
        - inputs:
            pdf_path: examples/shipping_notice.pdf
          outputs: {}
          exit: not_an_invoice
          env:
            RECORDS_DIR: '{tmp}/records'
            REVIEW_DIR: '{tmp}/review'
            ESCALATIONS_DIR: '{tmp}/escalations'
        - inputs:
            pdf_path: examples/hooli_credit_note_311.pdf
          outputs: {}
          exit: needs_review
          env:
            RECORDS_DIR: '{tmp}/records'
            REVIEW_DIR: '{tmp}/review'
            ESCALATIONS_DIR: '{tmp}/escalations'
        steps:
          read:
            use: ./steps/read_pdf
          extract:
            use: ./steps/extract_invoice_fields
          validate:
            use: ./steps/validate_fields
          fix:
            use: ./steps/fix_fields
          save:
            use: ./steps/save_record
          escalate:
            use: ./steps/escalate_to_human
        edges:
        - from: read.done
          to:
          - step: extract
            with:
              invoice_text: steps.read.outputs.text
          kind: deterministic
        - from: extract.done
          to:
          - step: validate
            with:
              fields: steps.extract.outputs
          kind: deterministic
        - from: extract.not_an_invoice
          to:
          - step: $exit.not_an_invoice
            with: {}
          kind: deterministic
        - from: validate.done
          to:
          - step: save
            when: steps.validate.outputs.valid
            with:
              record: steps.validate.outputs.record
              dest: if steps.validate.outputs.fields.total > 10000 then env.REVIEW_DIR else env.RECORDS_DIR
          - step: fix
            when: steps.validate.outputs.fixable and steps.fix.runs < 3
            with:
              invoice_text: steps.read.outputs.text
              fields: steps.validate.outputs.fields
              errors: steps.validate.outputs.errors
            limits:
              max_traversals: 10
          - step: escalate
            with:
              fields: steps.validate.outputs.fields
              errors: steps.validate.outputs.errors
              queue_dir: env.ESCALATIONS_DIR
              run_id: run.id
          kind: deterministic
        - from: fix.done
          to:
          - step: validate
            with:
              fields: steps.fix.outputs
            limits:
              max_traversals: 10
          kind: deterministic
        - from: save.done
          to:
          - step: $exit.done
            with:
              record: steps.save.outputs.record
          kind: deterministic
        - from: escalate.done
          to:
          - step: $exit.needs_review
            with: {}
          kind: deterministic
        finally: []
      nodes:
        read:
          step: process_supplier_invoice#read_pdf
        extract:
          step: process_supplier_invoice#extract_invoice_fields
        validate:
          step: process_supplier_invoice#validate_fields
        fix:
          step: process_supplier_invoice#fix_fields
        save:
          step: process_supplier_invoice#save_record
