kind: process
name: main
entry: first
inputs:
  text: string
outputs:
  result: string
steps:
  first:  { use: ./steps/first }
  check:  { use: ./steps/check }
  second: { use: ./steps/second }
edges:
  - from: first.done
    to: check
    with: { value: steps.first.outputs.value }
  - from: check.bad
    to: first
    with: { text: steps.check.outputs.reason }
  - from: check.ok
    to:
      - step: check
        when: steps.check.runs < 2
        with: { value: steps.check.outputs.value }
        limits: { max_traversals: 3 }
      - step: second
        with: { value: steps.check.outputs.value }
  - from: second.done
    to: $exit.done
    with: { result: steps.second.outputs.result }
