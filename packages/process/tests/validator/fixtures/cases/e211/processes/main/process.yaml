kind: process
name: main
entry: first
inputs:
  text: string
outputs:
  done: { result: string }
  skipped: {}
steps:
  first:  { use: ./steps/first }
  check:  { use: ./steps/check }
edges:
  - from: first.done
    to: check
    with: { value: steps.first.outputs.value }
  - from: check.ok
    to: $exit.done
    with: { value: steps.check.outputs.value }
  - from: check.bad
    to: $exit.skipped
    with: { reason: steps.check.outputs.reason }
