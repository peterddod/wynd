kind: process
name: main
entry: first
inputs:
  text: string
outputs:
  result: string
steps:
  first:  { use: ./steps/first }
  second: { use: ./steps/second }
edges:
  - from: first.done
    to: second
    with: { val: steps.first.outputs.value }
  - from: second.done
    to: $exit.done
    with: { result: steps.second.outputs.result }
