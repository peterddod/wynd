kind: process
name: main
entry: first
inputs:
  text: string
outputs:
  result: string
steps:
  first:  { use: ./steps/first }
  check:  { use: ./steps/check }
  second: { use: ./steps/second }
edges:
  - from: first.done
    to: check
    with: { value: steps.first.outputs.value }
  - from: check.ok
    to: second
    with: { value: steps.check.outputs.value }
  - from: check.bad
    to: $ignore
