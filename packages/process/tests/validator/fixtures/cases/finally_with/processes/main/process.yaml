kind: process
name: main
entry: first
inputs:
  text: string
outputs:
  result: string
steps:
  first:  { use: ./steps/first }
  second: { use: ./steps/second }
  report: { use: ./steps/second }
  audit:  { use: ./steps/second }
edges:
  - from: first.done
    to: second
    with: { value: steps.first.outputs.value }
  - from: second.done
    to: $exit.done
    with: { result: steps.second.outputs.result }
finally:
  - step: report
    with: { value: steps.second.outputs.result }
  - step: audit
    with: { value: 'default(steps.second.outputs.result, "")' }
