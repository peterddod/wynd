kind: process
name: main
entry: first
inputs:
  text: string
outputs:
  result: string
steps:
  first:  { use: ./steps/first }
  check:  { use: ./steps/check }
  second: { use: ./steps/second }
edges:
  - from: first.done
    to: check
    with: { value: steps.second.outputs.result }
  - from: check.ok
    to: second
    with: { value: steps.check.outputs.reason }
  - from: check.bad
    to: second
    with: { value: steps.check.outputs.valu }
  - from: second.done
    to:
      - step: $exit.done
        when: edges["check.ok"][3].taken > 0 or steps.missing.runs > 0
        with: { result: process.inputs.body }
      - step: $exit.done
        with: { result: steps.check.outputs.value }
