kind: process
name: main
entry: first
inputs:
  text: string
outputs:
  result: string
steps:
  first:  { use: ./steps/first }
  guess:  { use: ./steps/guess }
edges:
  - from: first.done
    to: guess
    with: { value: steps.first.outputs.value, hint: steps.first.outputs.value }
  - from: guess.done
    to: $exit.done
    with: { result: steps.guess.outputs.labl }
