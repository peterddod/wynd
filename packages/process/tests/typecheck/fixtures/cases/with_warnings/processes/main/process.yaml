kind: process
name: main
entry: first
env:
  vars: { OUT_DIR: where results go }
inputs:
  text: string
  count: integer
outputs:
  result: string
steps:
  first:   { use: ./steps/first }
  counter: { use: ./steps/counter }
edges:
  - from: first.done
    to: counter
    with:
      n: steps.first.outputs.total
      day: steps.first.outputs.value
      label: steps.first.outputs.note
      when: steps.first.outputs.day
  - from: counter.done
    to: $exit.done
    with: { result: 'coalesce(env.OUT_DIR, env.OTHER_DIR)' }
