kind: process
name: main
entry: first
env:
  vars: { OUT_DIR: where results go }
inputs:
  text: string
  count: integer
outputs:
  result: string
steps:
  first:   { use: ./steps/first }
  second:  { use: ./steps/second }
  handler: { use: ./steps/handler }
edges:
  - from: first.done
    to: second
    with: { value: steps.first.outputs.value, amount: steps.first.outputs.total }
  - from: second.done
    to: $exit.done
    with: { result: steps.second.outputs.result }
on_error: handler
