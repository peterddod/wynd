kind: process
name: main
entry: first
env:
  vars: { OUT_DIR: where results go }
inputs:
  text: string
  count: integer
outputs:
  result: string
steps:
  first:  { use: ./steps/first }
  guess:  { use: ./steps/guess }
  second: { use: ./steps/second }
edges:
  - from: first.done
    to: guess
    with: { value: steps.first.outputs.total }
  - from: guess.done
    to: second
    with: { value: previous.outputs.label, amount: steps.first.outputs.total }
  - from: second.done
    to: $exit.done
    with: { result: steps.second.outputs.result }
