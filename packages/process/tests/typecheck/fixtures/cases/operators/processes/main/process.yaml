kind: process
name: main
entry: first
env:
  vars: { OUT_DIR: where results go }
inputs:
  text: string
  count: integer
outputs:
  result: string
steps:
  first:  { use: ./steps/first }
  second: { use: ./steps/second }
edges:
  - from: first.done
    to:
      - step: second
        when: steps.first.outputs.value > 3
        with: { value: steps.first.outputs.note + "!", amount: steps.first.outputs.total }
        limits: { timeout: steps.first.outputs.value * 2 }
      - step: second
        with: { value: steps.first.outputs.value, amount: 'len(steps.first.outputs.size)' }
  - from: second.done
    to: $exit.done
    with: { result: steps.second.outputs.result }
