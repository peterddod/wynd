[project]
name = "wynd-compiler"
version = "0.1.0"
description = "Wynd compiler: compile sessions and the generate-test-revise loop from proto-steps to step packages"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
  "wynd-spec",
  "wynd-runtime",
  "wynd-process",
  "pyyaml>=6",
  "claude-agent-sdk>=0.2.157,<0.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wynd"]

[tool.uv.sources]
wynd-spec = { workspace = true }
wynd-runtime = { workspace = true }
wynd-process = { workspace = true }
