# ScriptedLLM unit-test script (test_llm.py): two nodes, per-(kind, node) ordering, a module_source_file response.
calls:
  - kind: decide
    node: parse
    response:
      examples: [{index: 1, needs: pure, why: "digits"}, {index: 2, needs: judgement, why: "words"}]
      command: false
      program: ""
      summary: "One numeric amount and one written in words."
  - kind: write_deterministic
    node: parse
    usage: {input_tokens: 120, output_tokens: 40, cost_usd: 0.01, latency_ms: 900}
    response:
      module_source_file: unit_module.py
      deps: []
      system_packages: []
      requires_glibc: false
      effects: []
      env_vars: []
      notes: "Parses numeric amounts."
  - kind: decide
    node: shout
    response:
      examples: [{index: 1, needs: pure, why: "upper case"}]
      command: true
      program: tr
      summary: "Runs tr."
  - kind: decide
    node: parse
    response:
      examples: [{index: 1, needs: pure, why: "digits"}, {index: 2, needs: pure, why: "words, with a table"}]
      command: false
      program: ""
      summary: "Both are pure."
