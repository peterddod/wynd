[project]
name = "wynd-kube"
version = "0.1.0"
description = "Wynd on Kubernetes: job runner, triggers, serving backend and install manifests"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["wynd-controller", "httpx>=0.27", "pyyaml>=6", "typer>=0.12"]

[project.scripts]
wynd-kube = "wynd.kube.cli:app"

[project.entry-points."wynd.job_runners"]
kube = "wynd.kube.runner:KubeJobRunner.from_env"

[project.entry-points."wynd.trigger_backends"]
kube = "wynd.kube.triggers:KubeTriggerBackend.from_env"

[project.entry-points."wynd.serving_backends"]
kube = "wynd.kube.serving:KubeServingBackend.from_env"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wynd"]

[tool.uv.sources]
wynd-controller = { workspace = true }
