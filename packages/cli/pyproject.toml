[project]
name = "wynd-cli"
version = "0.1.0"
description = "The wynd command line"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["wynd-controller", "typer>=0.12", "pyyaml>=6"]

[project.scripts]
wynd = "wynd.cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wynd"]

[tool.uv.sources]
wynd-controller = { workspace = true }
